// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    id 'com.android.application' version '8.1.0' apply false // Use the latest version of AGP
    id 'com.android.library' version '8.1.0' apply false    // Update this if you have libraries
    id 'com.google.gms.google-services' version '4.3.15' apply false // Google Services Plugin
    id 'com.adarshr.test-logger' version '2.0.0' apply false // Test Logger Plugin
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
